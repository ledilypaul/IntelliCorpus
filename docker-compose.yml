services:
  intellicorpus_db:
    image: pgvector/pgvector:pg17
    container_name: intellicorpus_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      TZ: Europe/Paris
    ports:
      - "5433:5432"
    volumes:
      - intellicorpus_postgres_data:/var/lib/postgresql/data

  intellicorpus_minio:
    image: minio/minio:latest
    container_name: intellicorpus_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - intellicorpus_minio_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: intellicorpus_n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
      - TZ=Europe/Paris
      - N8N_AUTHENTICATION_DISABLED=true
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=intellicorpus_postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - intellicorpus_db

volumes:
  intellicorpus_postgres_data:
  intellicorpus_minio_data:
  n8n_data:
