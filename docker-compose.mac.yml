services:
  intellicorpus_db:
    image: pgvector/pgvector:pg17
    container_name: intellicorpus_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Europe/Paris

    ports:
      - "5433:5432"

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    mem_limit: 1g

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  intellicorpus_minio:
    image: minio/minio:latest
    container_name: intellicorpus_minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - ./data/minio:/data

    mem_limit: 512m

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
